services:
  app:
    build: .
    image: ${IMAGE_NAME:-library-cicd-lab}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - DB_PATH=/data/library.db
    volumes:
      - library-data:/data
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  library-data:
