# cAdvisor: собирает статистику по каждому контейнеру на узле.
# В minikube рантайм — containerd, поэтому cAdvisor подключается к его сокету.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: cadvisor
  template:
    metadata:
      labels:
        app: cadvisor
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:v0.49.1
          args:
            - --containerd=/run/containerd/containerd.sock
            - --docker_only=false
            - --housekeeping_interval=10s
            - --max_housekeeping_interval=15s
            # оставляем только метки, нужные для namespace/pod/container
            - --store_container_labels=false
            - --whitelisted_container_labels=io.kubernetes.container.name,io.kubernetes.pod.name,io.kubernetes.pod.namespace
            # отключаем лишние группы метрик, чтобы не грузить ноут
            - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,process,advtcp,memory_numa,cpuset
          securityContext:
            privileged: true
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: rootfs,     mountPath: /rootfs,          readOnly: true}
            - {name: containerd, mountPath: /run/containerd,  readOnly: true}
            - {name: sys,        mountPath: /sys,             readOnly: true}
            - {name: disk,       mountPath: /dev/disk,        readOnly: true}
            - {name: kmsg,       mountPath: /dev/kmsg,        readOnly: true}
      volumes:
        - {name: rootfs,     hostPath: {path: /}}
        - {name: containerd, hostPath: {path: /run/containerd}}
        - {name: sys,        hostPath: {path: /sys}}
        - {name: disk,       hostPath: {path: /dev/disk}}
        - {name: kmsg,       hostPath: {path: /dev/kmsg}}
---
apiVersion: v1
kind: Service
metadata:
  name: cadvisor
  namespace: monitoring
spec:
  selector:
    app: cadvisor
  ports:
    - port: 8080
      targetPort: 8080
