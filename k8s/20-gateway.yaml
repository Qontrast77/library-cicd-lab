# __TAG__ подставляется scripts/deploy.ps1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: library
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: nginx
          image: library/gateway:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /api/health, port: 80}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 80}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: library
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
