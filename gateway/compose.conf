# Конфигурация шлюза для запуска через docker compose (ЛР №5, без Kubernetes).
# Отличия от default.conf (k8s): сервисы слушают порт 5000, добавлен genre-service.
server {
    listen 80;
    add_header X-Gateway $hostname always;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location = /api/health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /api/authors { proxy_pass http://authors-service:5000; include /etc/nginx/proxy_params.conf; }
    location /api/books   { proxy_pass http://books-service:5000;   include /etc/nginx/proxy_params.conf; }
    location /api/members { proxy_pass http://members-service:5000; include /etc/nginx/proxy_params.conf; }
    location /api/loans   { proxy_pass http://loans-service:5000;   include /etc/nginx/proxy_params.conf; }
    # первый запрос может загружать модель из MLflow дольше обычного
    location /api/genre   { proxy_pass http://genre-service:5000;   include /etc/nginx/proxy_params.conf; proxy_read_timeout 120s; }
}
